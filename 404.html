<style>
  :root{--paper:#1e1e2e;--ink:#cdd6f4;--muted:#a6adc8;--line:#45475a;--mauve:#cba6f7;--peach:#fab387;--teal:#94e2d5;--mono:Consolas,'Liberation Mono',monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;padding:32px}
  main{width:min(680px,100%);text-align:center}
  .kicker{font:10px/1.5 var(--mono);letter-spacing:.18em;color:var(--mauve);margin:0 0 26px}
  pre{font:13px/1.25 var(--mono);color:var(--teal);margin:0 auto 28px;text-align:left;display:inline-block}
  h1{font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-weight:500;font-size:clamp(34px,7vw,64px);letter-spacing:-.03em;line-height:1.2;margin:0 0 18px}
  p{color:var(--muted);font-size:14px;line-height:1.9;margin:0 auto;max-width:34em}
  .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:32px}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 22px;border:1px solid var(--line);border-radius:30px;color:var(--ink);text-decoration:none;font-size:12px;transition:background .2s,border-color .2s}
  .pill:hover{border-color:var(--mauve);background:#313244}
  .pill.dark{background:var(--mauve);border-color:var(--mauve);color:#1e1e2e}
  .pill.dark:hover{background:#b4befe;border-color:#b4befe}
  .meta{font:9px/1.6 var(--mono);letter-spacing:.12em;color:var(--muted);margin-top:52px}
</style>
</head>
